name: Athar Android Toolchain Export
on:
  pull_request:
    paths:
      - '.github/workflows/athar-toolchain.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/athar-toolchain/android-sdk/build-tools" "$RUNNER_TEMP/athar-toolchain/android-sdk/platforms"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PL="$ANDROID_HOME/platforms/android-35"
          test -x "$BT/aapt2"
          test -x "$BT/d8"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          test -f "$PL/android.jar"
          cp -a "$BT" "$RUNNER_TEMP/athar-toolchain/android-sdk/build-tools/"
          cp -a "$PL" "$RUNNER_TEMP/athar-toolchain/android-sdk/platforms/"
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Export Gradle
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          G="$(readlink -f "$(command -v gradle)")"
          GROOT="$(dirname "$(dirname "$G")")"
          cp -a "$GROOT" "$RUNNER_TEMP/athar-toolchain/gradle-8.11.1"
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: athar-android-toolchain
          path: ${{ runner.temp }}/athar-toolchain
          compression-level: 6
          retention-days: 1
