name: Athar Android Toolchain Export
on:
  pull_request:
    paths:
      - '.github/workflows/athar-toolchain.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
          mkdir -p "$RUNNER_TEMP/athar-toolchain/android-sdk/build-tools" "$RUNNER_TEMP/athar-toolchain/android-sdk/platforms"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1 || true)"
          if [ -n "$SDKM" ]; then yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0"; fi
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          PL="$ANDROID_HOME/platforms/android-35"
          test -d "$BT"
          test -f "$PL/android.jar"
          cp -a "$BT" "$RUNNER_TEMP/athar-toolchain/android-sdk/build-tools/"
          cp -a "$PL" "$RUNNER_TEMP/athar-toolchain/android-sdk/platforms/"
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Export Gradle
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          G="$(readlink -f "$(command -v gradle)")"
          GROOT="$(dirname "$(dirname "$G")")"
          cp -a "$GROOT" "$RUNNER_TEMP/athar-toolchain/gradle-8.11.1"
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: athar-android-toolchain
          path: ${{ runner.temp }}/athar-toolchain
          compression-level: 6
          retention-days: 1
