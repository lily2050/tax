name: Build V15 Runtime and Android Toolchain
on:
  push:
    branches: [chatgpt-build-v15]
  workflow_dispatch:

jobs:
  ocr-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official Tesseract.js runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/runtime out/core out/lang out/test
          npm pack tesseract.js@7.0.0
          npm pack tesseract.js-core@7.0.0
          tar -xzf tesseract.js-7.0.0.tgz
          cp package/dist/tesseract.min.js out/runtime/
          cp package/dist/worker.min.js out/runtime/
          cp package/dist/tesseract.min.js.LICENSE.txt out/runtime/ || true
          cp package/dist/worker.min.js.LICENSE.txt out/runtime/ || true
          rm -rf package
          tar -xzf tesseract.js-core-7.0.0.tgz
          cp package/tesseract-core*.wasm.js out/core/
          cp package/LICENSE out/core/LICENSE_TESSERACT_CORE
          curl -fL --retry 3 https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o out/lang/eng.traineddata.gz
          curl -fL --retry 3 https://tessdata.projectnaptha.com/4.0.0/ara.traineddata.gz -o out/lang/ara.traineddata.gz
          sha256sum out/runtime/* out/core/* out/lang/* > out/SHA256SUMS.txt

      - name: Browser OCR integration test
        shell: bash
        run: |
          set -euxo pipefail
          cat > out/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><link rel="icon" href="data:,">
          <script src="./runtime/tesseract.min.js"></script>
          <canvas id="c" width="1200" height="220"></canvas>
          <pre id="out">START</pre>
          <script>
          (async()=>{
            const c=document.getElementById('c'),x=c.getContext('2d');
            let worker;
            try{
              worker=await Tesseract.createWorker('ara+eng',1,{
                workerPath:'./runtime/worker.min.js',
                langPath:'./lang',
                corePath:'./core',
                workerBlobURL:false,
                logger:m=>console.log('OCR',m.status,m.progress||0)
              });

              x.fillStyle='white';x.fillRect(0,0,c.width,c.height);
              x.fillStyle='black';x.font='56px Arial';
              x.textAlign='left';x.direction='ltr';
              x.fillText('Employee Ahmed Department Operations',20,100);
              const en=(await worker.recognize(c))?.data?.text?.trim()||'';

              x.fillStyle='white';x.fillRect(0,0,c.width,c.height);
              x.fillStyle='black';x.font='64px "DejaVu Sans", Arial';
              x.textAlign='right';x.direction='rtl';
              x.fillText('مرحبا أحمد',1160,110);
              const ar=(await worker.recognize(c))?.data?.text?.trim()||'';

              const passEn=/Employee/i.test(en)&&/Ahmed/i.test(en);
              const passAr=/[\u0600-\u06FF]{2,}/.test(ar);
              const payload={passEn,passAr,en,ar};
              document.getElementById('out').textContent=JSON.stringify(payload);
              document.body.dataset.pass=(passEn&&passAr)?'1':'0';
              document.body.dataset.text=JSON.stringify(payload);
            }catch(e){
              document.getElementById('out').textContent='ERR '+e.stack;
              document.body.dataset.pass='0';
              document.body.dataset.text=String(e.stack||e);
            }finally{try{await worker?.terminate()}catch(e){}}
          })();
          </script>
          EOF
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0 http-server@14.1.1
          npx http-server out -p 8080 -a 127.0.0.1 >/tmp/v15-http.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          cat > test-browser.cjs <<'EOF'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          (async()=>{
            const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'];
            const exe=candidates.find(fs.existsSync);
            if(!exe) throw new Error('Chrome/Chromium not found');
            const b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            const p=await b.newPage();
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:8080',{waitUntil:'load',timeout:30000});
            await p.waitForFunction(()=>document.body.dataset.pass==='1'||document.body.dataset.pass==='0',{timeout:180000});
            const pass=await p.evaluate(()=>document.body.dataset.pass);
            const text=await p.evaluate(()=>document.body.dataset.text||'');
            const result={pass:pass==='1'&&errors.length===0,text,errors,ua:await p.evaluate(()=>navigator.userAgent)};
            fs.writeFileSync('out/test/BROWSER_OCR_TEST.json',JSON.stringify(result,null,2));
            console.log(result);
            await b.close();
            if(!result.pass) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node test-browser.cjs
          kill $SERVER_PID || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-tesseract-runtime
          path: out/
          if-no-files-found: error
          compression-level: 6

  android-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components using runner SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p toolchain/build-tools/lib toolchain/build-tools/lib64 toolchain/platform
          BT="$ANDROID_HOME/build-tools/35.0.0"
          cp "$ANDROID_HOME/platforms/android-35/android.jar" toolchain/platform/
          cp "$BT/aapt2" toolchain/build-tools/
          cp "$BT/zipalign" toolchain/build-tools/
          cp "$BT/apksigner" toolchain/build-tools/
          cp "$BT/d8" toolchain/build-tools/
          cp "$BT/lib/d8.jar" toolchain/build-tools/lib/
          cp "$BT/lib/apksigner.jar" toolchain/build-tools/lib/\n          cp "$BT/lib64/libc++.so" toolchain/build-tools/lib64/
          chmod +x toolchain/build-tools/aapt2 toolchain/build-tools/zipalign toolchain/build-tools/apksigner toolchain/build-tools/d8
          sha256sum toolchain/build-tools/aapt2 toolchain/build-tools/zipalign toolchain/build-tools/apksigner toolchain/build-tools/d8 toolchain/build-tools/lib/*.jar toolchain/build-tools/lib64/libc++.so toolchain/platform/android.jar > toolchain/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: v15-android-toolchain
          path: toolchain/
          if-no-files-found: error
          compression-level: 6
